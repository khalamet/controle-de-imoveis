name: Keep Supabase Ativo

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Conexao real no banco (psql)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" -c "SELECT 1;" && echo "BANCO ATIVO: conexao real realizada."
