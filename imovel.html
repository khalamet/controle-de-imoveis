<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detalhes do Imóvel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    ::-webkit-scrollbar{ width:10px; height:10px; }
    ::-webkit-scrollbar-track{ background:#e2e8f0; }
    ::-webkit-scrollbar-thumb{
      background:#94a3b8;
      border-radius:999px;
      border:2px solid #e2e8f0;
    }
    ::-webkit-scrollbar-thumb:hover{ background:#64748b; }

    body{
      background:#f1f5f9;
      padding:40px;
    }

    .box{
      background:white;
      max-width:900px;
      margin:auto;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
    }

    .aviso-arquivado{
      background:rgba(245,158,11,0.12);
      border:1px solid rgba(245,158,11,0.4);
      color:#92400e;
      padding:14px 18px;
      border-radius:12px;
      margin-bottom:24px;
      font-size:14px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    h1{
      margin-bottom:35px;
      color:#0f172a;
      font-size:36px;
    }

    h2{
      color:#0f172a;
      font-size:20px;
      margin:35px 0 18px 0;
      padding-top:25px;
      border-top:1px solid #e2e8f0;
    }

    .campo{
      margin-bottom:25px;
    }

    .campo label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#334155;
    }

    .campo input,
    .campo textarea,
    .campo select{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid #cbd5e1;
      font-size:16px;
    }

    textarea{
      min-height:120px;
      resize:vertical;
    }

    .foto-preview{
      width:100%;
      max-height:300px;
      object-fit:cover;
      border-radius:14px;
      margin-bottom:14px;
      display:block;
    }

    .foto-acoes{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .reajuste-box{
      border-radius:12px;
      padding:16px 18px;
      font-size:14.5px;
      line-height:1.6;
      margin-bottom:18px;
    }

    .reajuste-ok{
      background:rgba(22,163,74,0.1);
      border:1px solid rgba(22,163,74,0.35);
      color:#166534;
    }

    .reajuste-proximo{
      background:rgba(245,158,11,0.12);
      border:1px solid rgba(245,158,11,0.4);
      color:#92400e;
    }

    .reajuste-pendente{
      background:rgba(220,38,38,0.1);
      border:1px solid rgba(220,38,38,0.4);
      color:#991b1b;
    }

    .reajuste-neutro{
      background:#f1f5f9;
      border:1px solid #cbd5e1;
      color:#475569;
    }

    .doc-linha-upload{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:flex-end;
      margin-bottom:18px;
    }

    .doc-linha-upload .campo{
      margin-bottom:0;
      flex:1;
      min-width:180px;
    }

    .doc-item{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:12px 14px;
      margin-bottom:10px;
    }

    .doc-badge{
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      color:white;
      flex-shrink:0;
    }

    .doc-roxo{ background:#7c3aed; }
    .doc-ambar{ background:#d97706; }
    .doc-azul{ background:#2563eb; }
    .doc-verde{ background:#16a34a; }
    .doc-teal{ background:#0d9488; }
    .doc-cinza{ background:#64748b; }

    .doc-info{
      flex:1;
      min-width:160px;
    }

    .doc-nome{
      color:#0f172a;
      font-size:14.5px;
      font-weight:bold;
      word-break:break-all;
    }

    .doc-data{
      color:#64748b;
      font-size:12px;
    }

    .doc-acoes{
      display:flex;
      gap:8px;
    }

    .doc-acoes a,
    .doc-acoes button{
      padding:8px 14px;
      border-radius:8px;
      font-size:13px;
      text-decoration:none;
      cursor:pointer;
      border:none;
      color:white;
    }

    .doc-abrir{ background:#2563eb; }
    .doc-excluir{ background:#dc2626; }

    .botoes{
      display:flex;
      gap:15px;
      margin-top:35px;
      flex-wrap:wrap;
    }

    .botoes button{
      flex:1;
      min-width:160px;
    }

    button{
      padding:14px 22px;
      border:none;
      border-radius:12px;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:filter 0.2s;
    }

    button:hover{ filter:brightness(1.1); }

    .salvar{ background:#16a34a; }
    .voltar{ background:#0f172a; }
    .upload{ background:#2563eb; }
    .remover{ background:#dc2626; }
    .carneleao{ background:#7c3aed; }
    .portaldasfinancas{ background:#ea580c; }
    .arquivar{ background:#b45309; }
    .reajuste-btn{ background:#0d9488; }

    .status{
      margin-top:25px;
      font-weight:bold;
    }

    #camposAluguel{
      display:none;
    }

    .linkContrato{
      display:inline-block;
      margin-top:12px;
      color:#2563eb;
      text-decoration:none;
      font-weight:bold;
    }

    .vazio-docs{
      color:#64748b;
      font-size:14px;
      padding:10px 0;
    }

  </style>
</head>
<body>

<div class="box">

  <div class="aviso-arquivado" id="avisoArquivado" style="display:none">
    ⚠️ Este imóvel está arquivado e não aparece mais no painel principal. Os lançamentos antigos continuam preservados.
  </div>

  <h1 id="titulo">Carregando...</h1>

  <div class="campo">
    <label>Foto do imóvel</label>
    <img id="fotoPreview" class="foto-preview" style="display:none">
    <input type="file" id="fotoArquivo" accept="image/*">
    <div class="foto-acoes" style="margin-top:12px">
      <button class="upload" onclick="uploadFoto()">Enviar foto</button>
      <button class="remover" onclick="removerFoto()">Remover foto</button>
    </div>
  </div>

  <div class="campo">
    <label>Nome do imóvel</label>
    <input type="text" id="nome" oninput="toggleAluguel()">
  </div>

  <div class="campo">
    <label>Endereço</label>
    <textarea id="endereco"></textarea>
  </div>

  <div class="campo">
    <label>Matrícula RGI</label>
    <input type="text" id="rgi">
  </div>

  <div class="campo">
    <label>Matrícula IPTU</label>
    <input type="text" id="iptu">
  </div>

  <div class="campo">
    <label>Saldo devedor para quitação (R$)</label>
    <input type="text" id="saldo_devedor" placeholder="Ex: 180.000,00 (deixe vazio se quitado)">
  </div>

  <div class="campo">
    <label>Alugado?</label>
    <select id="alugado" onchange="toggleAluguel()">
      <option value="nao">Não</option>
      <option value="sim">Sim</option>
    </select>
  </div>

  <div id="camposAluguel">

    <div class="campo">
      <label>Valor do aluguel</label>
      <input type="text" id="valor_aluguel">
    </div>

    <div class="campo">
      <label>Último pagamento</label>
      <input type="date" id="ultimo_pagamento">
    </div>

    <div class="campo">
      <label>Inquilino atual</label>
      <input type="text" id="inquilino">
    </div>

    <div class="campo">
      <label>Data de assinatura do contrato</label>
      <input type="date" id="data_assinatura" onchange="atualizarReajuste()">
    </div>

    <div class="campo">
      <label>Último reajuste realizado</label>
      <input type="date" id="data_ultimo_reajuste" onchange="atualizarReajuste()">
    </div>

    <div class="reajuste-box reajuste-neutro" id="reajusteBox"></div>

    <button
      class="reajuste-btn"
      style="margin-bottom:25px"
      onclick="marcarReajuste()">
      Marcar reajuste como realizado
    </button>

    <div class="campo">
      <label>Contrato de aluguel</label>
      <input type="file" id="contratoArquivo">

      <button
        class="upload"
        style="margin-top:12px"
        onclick="uploadContrato()">
        Upload contrato
      </button>

      <div id="contratoAtual"></div>

      <button
        class="remover"
        style="margin-top:15px"
        onclick="removerContrato()">
        Remover contrato
      </button>
    </div>

  </div>

  <h2>Documentos do imóvel</h2>

  <div class="doc-linha-upload">

    <div class="campo">
      <label>Tipo de documento</label>
      <select id="docTipo">
        <option value="RGI">RGI / Matrícula</option>
        <option value="Escritura">Escritura</option>
        <option value="IPTU">IPTU / Carnê</option>
        <option value="Contrato">Contrato</option>
        <option value="Comprovante">Comprovante</option>
        <option value="Outro">Outro</option>
      </select>
    </div>

    <div class="campo">
      <label>Arquivo</label>
      <input type="file" id="docArquivo">
    </div>

    <button class="upload" onclick="uploadDocumento()">
      Enviar documento
    </button>

  </div>

  <div id="listaDocumentos">
    <div class="vazio-docs">Carregando documentos...</div>
  </div>

  <div class="botoes">

    <button class="salvar" onclick="salvar()">Salvar</button>

    <button
      class="upload"
      id="btnRecibo"
      style="display:none"
      onclick="emitirRecibo()">
      Emitir recibo PDF
    </button>

    <button
      class="carneleao"
      id="btnCarneLeao"
      style="display:none"
      onclick="abrirCarneLeao()">
      Meu Carnê-Leão
    </button>

    <button
      class="portaldasfinancas"
      id="btnPortalFinancas"
      style="display:none"
      onclick="abrirPortalFinancas()">
      Portal das Finanças
    </button>

    <button
      class="arquivar"
      id="btnArquivar"
      onclick="arquivarImovel()">
      Arquivar imóvel
    </button>

    <button class="voltar" onclick="voltar()">Voltar</button>

  </div>

  <div class="status" id="status"></div>

</div>

<script>

  if(localStorage.getItem("logado") !== "sim"){
    window.location.href = "index.html";
  }

  const SUPABASE_URL =
    "https://xkiswuhpgbifjshjmuvf.supabase.co";

  const SUPABASE_KEY = "__SUPABASE_KEY__";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const params =
    new URLSearchParams(window.location.search);

  const slug = params.get("id");

  let imovelId = null;
  let imovelAtivo = true;

  const CORES_TIPO = {
    "RGI": "doc-roxo",
    "IPTU": "doc-ambar",
    "Escritura": "doc-azul",
    "Contrato": "doc-verde",
    "Comprovante": "doc-teal",
    "Outro": "doc-cinza"
  };

  function escapeHtml(texto){
    return String(texto || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function parseValor(txt){
    let s = String(txt || "").trim();
    if(!s) return null;
    if(s.includes(",")){
      s = s.replace(/\./g, "").replace(",", ".");
    }
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  function formatarBRL(valor){
    return "R$ " + Number(valor).toLocaleString(
      "pt-BR",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 }
    );
  }

  function calcularReajuste(dataAssinatura, dataUltimoReajuste){

    if(!dataAssinatura) return null;

    const partes = String(dataAssinatura).split("-");
    const anoInicio = parseInt(partes[0], 10);
    const mes = parseInt(partes[1], 10) - 1;
    const dia = parseInt(partes[2], 10);

    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);

    let ultimo = null;
    let proximo = null;

    for(let ano = anoInicio + 1; ano <= hoje.getFullYear() + 1; ano++){
      const d = new Date(ano, mes, dia);
      d.setHours(0, 0, 0, 0);
      if(d <= hoje){
        ultimo = d;
      }else{
        proximo = d;
        break;
      }
    }

    if(!proximo){
      proximo = new Date(hoje.getFullYear() + 1, mes, dia);
    }

    const dias = Math.ceil((proximo - hoje) / 86400000);

    const ultReaj = dataUltimoReajuste
      ? new Date(dataUltimoReajuste + "T00:00:00")
      : null;

    const pendente = !!ultimo && (!ultReaj || ultReaj < ultimo);

    return { ultimo, proximo, dias, pendente };
  }

  function atualizarReajuste(){

    const box = document.getElementById("reajusteBox");

    const assinatura =
      document.getElementById("data_assinatura").value;

    const ultReajuste =
      document.getElementById("data_ultimo_reajuste").value;

    const r = calcularReajuste(assinatura, ultReajuste);

    if(!r){
      box.className = "reajuste-box reajuste-neutro";
      box.innerHTML =
        "Informe a data de assinatura do contrato para ativar o alerta de reajuste anual (a cada 12 meses).";
      return;
    }

    const dataProximo =
      r.proximo.toLocaleDateString("pt-BR");

    if(r.pendente){
      box.className = "reajuste-box reajuste-pendente";
      box.innerHTML =
        "🔴 <strong>Reajuste pendente:</strong> o ciclo de 12 meses completou em " +
        r.ultimo.toLocaleDateString("pt-BR") +
        " e ainda não há reajuste registrado. Próximo ciclo: " +
        dataProximo + ".";
      return;
    }

    if(r.dias <= 60){
      box.className = "reajuste-box reajuste-proximo";
      box.innerHTML =
        "🟡 <strong>Reajuste se aproximando:</strong> o próximo ciclo de 12 meses vence em " +
        dataProximo + " (em " + r.dias + " dias).";
      return;
    }

    box.className = "reajuste-box reajuste-ok";
    box.innerHTML =
      "🟢 <strong>Reajuste em dia.</strong> Próximo ciclo de 12 meses: " +
      dataProximo + " (em " + r.dias + " dias).";
  }

  async function marcarReajuste(){

    const hoje = new Date().toISOString().slice(0, 10);

    document.getElementById("data_ultimo_reajuste").value = hoje;

    await salvar();
  }

  function verificarPorto(){
    const nome =
      document.getElementById("nome").value.toLowerCase();
    const endereco =
      document.getElementById("endereco").value.toLowerCase();
    const slugTexto = (slug || "").toLowerCase();
    return nome.includes("porto") ||
           endereco.includes("porto") ||
           slugTexto.includes("porto");
  }

  function toggleAluguel(){

    const alugado =
      document.getElementById("alugado").value;

    const campos =
      document.getElementById("camposAluguel");

    const btnRecibo =
      document.getElementById("btnRecibo");

    const btnCarneLeao =
      document.getElementById("btnCarneLeao");

    const btnPortalFinancas =
      document.getElementById("btnPortalFinancas");

    const isPorto = verificarPorto();

    if(alugado === "sim"){

      campos.style.display = "block";

      if(isPorto){
        btnRecibo.style.display = "none";
        btnCarneLeao.style.display = "none";
        btnPortalFinancas.style.display = "block";
      }else{
        btnRecibo.style.display = "block";
        btnCarneLeao.style.display = "block";
        btnPortalFinancas.style.display = "none";
      }

    }else{
      campos.style.display = "none";
      btnRecibo.style.display = "none";
      btnCarneLeao.style.display = "none";
      btnPortalFinancas.style.display = "none";
    }
  }

  async function carregarImovel(){

    const { data, error } =
      await supabaseClient
      .from("imoveis")
      .select("*")
      .eq("slug", slug)
      .single();

    if(error){
      console.log(error);
      alert("Erro ao carregar imóvel.");
      return;
    }

    imovelId = data.id;
    imovelAtivo = data.ativo !== false;

    if(!imovelAtivo){
      document.getElementById("avisoArquivado")
        .style.display = "flex";
      document.getElementById("btnArquivar")
        .style.display = "none";
    }

    document.getElementById("titulo").innerText = data.nome;
    document.getElementById("nome").value = data.nome;
    document.getElementById("endereco").value = data.endereco;
    document.getElementById("rgi").value = data.rgi;
    document.getElementById("iptu").value = data.iptu;

    document.getElementById("saldo_devedor").value =
      data.saldo_devedor != null
        ? Number(data.saldo_devedor).toLocaleString(
            "pt-BR",
            { minimumFractionDigits: 2, maximumFractionDigits: 2 }
          )
        : "";

    document.getElementById("alugado").value =
      data.alugado ? "sim" : "nao";
    document.getElementById("valor_aluguel").value =
      data.valor_aluguel || "";
    document.getElementById("ultimo_pagamento").value =
      data.ultimo_pagamento || "";
    document.getElementById("inquilino").value =
      data.inquilino || "";
    document.getElementById("data_assinatura").value =
      data.data_assinatura || "";
    document.getElementById("data_ultimo_reajuste").value =
      data.data_ultimo_reajuste || "";

    if(data.foto_url){
      const img = document.getElementById("fotoPreview");
      img.src = data.foto_url;
      img.style.display = "block";
    }

    if(data.contrato_url){
      document.getElementById("contratoAtual").innerHTML = `
        <a class="linkContrato"
           href="${data.contrato_url}"
           target="_blank">
          Ver contrato atual
        </a>`;
    }

    toggleAluguel();
    atualizarReajuste();
    carregarDocumentos();
  }

  /* ---------- DOCUMENTOS ---------- */

  async function carregarDocumentos(){

    const { data, error } =
      await supabaseClient
      .from("documentos")
      .select("*")
      .eq("imovel_id", imovelId)
      .order("criado_em", { ascending: false });

    const lista = document.getElementById("listaDocumentos");

    if(error){
      console.log(error);
      lista.innerHTML =
        '<div class="vazio-docs">Erro ao carregar documentos.</div>';
      return;
    }

    if(!data || data.length === 0){
      lista.innerHTML =
        '<div class="vazio-docs">Nenhum documento enviado ainda. Envie o RGI, a escritura, o carnê do IPTU ou outros arquivos deste imóvel.</div>';
      return;
    }

    lista.innerHTML = data.map(d => `
      <div class="doc-item">
        <span class="doc-badge ${CORES_TIPO[d.tipo] || "doc-cinza"}">
          ${escapeHtml(d.tipo)}
        </span>
        <div class="doc-info">
          <div class="doc-nome">${escapeHtml(d.nome)}</div>
          <div class="doc-data">
            Enviado em ${new Date(d.criado_em).toLocaleDateString("pt-BR")}
          </div>
        </div>
        <div class="doc-acoes">
          <a class="doc-abrir" href="${escapeHtml(d.url)}" target="_blank">
            Abrir
          </a>
          <button
            class="doc-excluir"
            onclick="excluirDocumento(${d.id}, '${escapeHtml(d.url)}')">
            Excluir
          </button>
        </div>
      </div>
    `).join("");
  }

  async function uploadDocumento(){

    const arquivo =
      document.getElementById("docArquivo").files[0];

    if(!arquivo){
      alert("Selecione um arquivo.");
      return;
    }

    const tipo = document.getElementById("docTipo").value;

    const extensao = arquivo.name.split(".").pop();

    const nomeSemAcento = arquivo.name
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

    const nomeSeguro =
      nomeSemAcento.replace(/[^a-zA-Z0-9.]/g, "_");

    const caminho =
      slug + "/" + Date.now() + "-" + nomeSeguro;

    const { error: uploadError } =
      await supabaseClient
      .storage
      .from("documentos")
      .upload(caminho, arquivo, { upsert: true });

    if(uploadError){
      console.log(uploadError);
      alert("Erro ao enviar documento: " + uploadError.message);
      return;
    }

    const { data: urlData } =
      supabaseClient
      .storage
      .from("documentos")
      .getPublicUrl(caminho);

    const { error: insertError } =
      await supabaseClient
      .from("documentos")
      .insert({
        imovel_id: imovelId,
        tipo: tipo,
        nome: arquivo.name,
        url: urlData.publicUrl
      });

    if(insertError){
      console.log(insertError);
      alert("Arquivo enviado, mas erro ao registrar: " + insertError.message);
      return;
    }

    document.getElementById("docArquivo").value = "";

    await carregarDocumentos();

    alert("Documento enviado com sucesso.");
  }

  async function excluirDocumento(id, url){

    if(!confirm("Deseja excluir este documento?")){
      return;
    }

    const partes = String(url).split("/documentos/");

    if(partes[1]){
      const caminho = decodeURIComponent(partes[1]);
      await supabaseClient
        .storage
        .from("documentos")
        .remove([caminho]);
    }

    const { error } =
      await supabaseClient
      .from("documentos")
      .delete()
      .eq("id", id);

    if(error){
      console.log(error);
      alert("Erro ao excluir documento.");
      return;
    }

    await carregarDocumentos();
  }

  /* ---------- FOTO ---------- */

  async function uploadFoto(){

    const arquivo =
      document.getElementById("fotoArquivo").files[0];

    if(!arquivo){
      alert("Selecione uma imagem.");
      return;
    }

    if(!arquivo.type.startsWith("image/")){
      alert("O arquivo precisa ser uma imagem.");
      return;
    }

    const ext = arquivo.name.split(".").pop();

    const nomeArquivo =
      "foto-" + slug + "-" + Date.now() + "." + ext;

    const { error: uploadError } =
      await supabaseClient
      .storage
      .from("imoveis")
      .upload(nomeArquivo, arquivo, { upsert: true });

    if(uploadError){
      console.log(uploadError);
      alert("Erro ao enviar a foto: " + uploadError.message);
      return;
    }

    const { data: urlData } =
      supabaseClient
      .storage
      .from("imoveis")
      .getPublicUrl(nomeArquivo);

    const fotoUrl = urlData.publicUrl;

    const { error: updateError } =
      await supabaseClient
      .from("imoveis")
      .update({ foto_url: fotoUrl })
      .eq("id", imovelId);

    if(updateError){
      console.log(updateError);
      alert(
        "A foto foi enviada, mas não foi possível salvar no cadastro: " +
        updateError.message
      );
      return;
    }

    const img = document.getElementById("fotoPreview");
    img.src = fotoUrl;
    img.style.display = "block";

    document.getElementById("fotoArquivo").value = "";

    alert("Foto enviada e salva com sucesso.");
  }

  async function removerFoto(){

    if(!confirm("Deseja remover a foto deste imóvel?")){
      return;
    }

    await supabaseClient
      .from("imoveis")
      .update({ foto_url: null })
      .eq("id", imovelId);

    const img = document.getElementById("fotoPreview");
    img.src = "";
    img.style.display = "none";

    alert("Foto removida.");
  }

  /* ---------- CONTRATO ---------- */

  async function uploadContrato(){

    const arquivo =
      document.getElementById("contratoArquivo").files[0];

    if(!arquivo){
      alert("Selecione um arquivo.");
      return;
    }

    const extensao = arquivo.name.split(".").pop();

    const nomeSemAcento = arquivo.name
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

    const nomeSeguro =
      nomeSemAcento.replace(/[^a-zA-Z0-9]/g, "_");

    const nomeFinal = nomeSeguro.replace(/_pdf$/i, "");

    const nomeArquivo =
      slug + "-" + Date.now() + "-" + nomeFinal + "." + extensao;

    const { error } =
      await supabaseClient
      .storage
      .from("contratos")
      .upload(nomeArquivo, arquivo, { upsert: true });

    if(error){
      console.log(error);
      alert("Erro ao enviar contrato.");
      return;
    }

    const { data } =
      supabaseClient
      .storage
      .from("contratos")
      .getPublicUrl(nomeArquivo);

    const contratoUrl = data.publicUrl;

    await supabaseClient
      .from("imoveis")
      .update({ contrato_url: contratoUrl })
      .eq("id", imovelId);

    document.getElementById("contratoAtual").innerHTML = `
      <a class="linkContrato"
         href="${contratoUrl}"
         target="_blank">
        Ver contrato atual
      </a>`;

    alert("Contrato enviado com sucesso.");
  }

  async function removerContrato(){

    if(!confirm("Deseja remover o contrato atual?")){
      return;
    }

    const { data: imovel } =
      await supabaseClient
      .from("imoveis")
      .select("contrato_url")
      .eq("id", imovelId)
      .single();

    if(!imovel.contrato_url){
      alert("Nenhum contrato encontrado.");
      return;
    }

    const partes = imovel.contrato_url.split("/");
    const nomeArquivo = partes[partes.length - 1];

    const { error } =
      await supabaseClient
      .storage
      .from("contratos")
      .remove([nomeArquivo]);

    if(error){
      alert("Erro ao remover contrato.");
      return;
    }

    await supabaseClient
      .from("imoveis")
      .update({ contrato_url: null })
      .eq("id", imovelId);

    document.getElementById("contratoAtual").innerHTML = "";
    alert("Contrato removido com sucesso.");
  }

  /* ---------- RECIBO E PORTAIS ---------- */

  async function emitirRecibo(){

    const mesReferencia = prompt("Mês de referência (ex: Maio 2026)");
    if(!mesReferencia) return;

    const valorRecebido = prompt("Valor recebido");
    if(!valorRecebido) return;

    const { data: configData } =
      await supabaseClient
      .from("configuracoes")
      .select("locador")
      .eq("id", 1)
      .single();

    const locador = configData.locador;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const endereco = document.getElementById("endereco").value;
    const inquilino = document.getElementById("inquilino").value;

    const hoje = new Date();
    const dataFormatada = hoje.toLocaleDateString("pt-BR", {
      day:"2-digit", month:"long", year:"numeric"
    });

    doc.setFont("helvetica");
    doc.setFontSize(20);
    doc.text("RECIBO DE ALUGUEL", 105, 25, { align:"center" });

    doc.setFontSize(12);
    doc.text("Total recebido", 160, 20);
    doc.setFontSize(16);
    doc.text("R$ " + valorRecebido, 160, 28);

    doc.setFontSize(14);
    doc.text("MÊS DE REFERÊNCIA:", 20, 55);
    doc.setFont("helvetica","bold");
    doc.text(mesReferencia, 20, 65);

    doc.setFont("helvetica","normal");
    doc.text("LOCATÁRIO(A):", 20, 85);
    doc.setFont("helvetica","bold");
    const textoInquilino = doc.splitTextToSize(
      inquilino || "Não informado", 170);
    doc.text(textoInquilino, 20, 95);
    const alturaInquilino = textoInquilino.length * 8;

    doc.setFont("helvetica","normal");
    doc.text("LOCADOR(A):", 20, 110 + alturaInquilino);
    doc.setFont("helvetica","bold");
    const textoLocador = doc.splitTextToSize(locador, 170);
    doc.text(textoLocador, 20, 120 + alturaInquilino);
    const alturaLocador = textoLocador.length * 8;

    doc.setFont("helvetica","normal");
    doc.text("ENDEREÇO DO IMÓVEL LOCADO:",
      20, 145 + alturaInquilino + alturaLocador);
    doc.text(endereco,
      20, 155 + alturaInquilino + alturaLocador,
      { maxWidth:170 });
    doc.line(20, 165 + alturaInquilino + alturaLocador,
             190, 165 + alturaInquilino + alturaLocador);

    const texto =
      `Recebi de ${inquilino} a quantia de R$ ${valorRecebido} como pagamento do aluguel do imóvel mencionado acima, referente ao mês de ${mesReferencia}.`;
    doc.text(texto,
      20, 185 + alturaInquilino + alturaLocador,
      { maxWidth:170 });

    doc.text("Locador:", 130, 235 + alturaInquilino + alturaLocador);
    doc.line(130, 245 + alturaInquilino + alturaLocador,
             190, 245 + alturaInquilino + alturaLocador);

    doc.text("Rio de Janeiro/RJ, " + dataFormatada,
      20, 265 + alturaInquilino + alturaLocador);

    doc.save("recibo-" + slug + ".pdf");
  }

  function abrirCarneLeao(){
    const nome = document.getElementById("nome").value;
    const inquilino =
      document.getElementById("inquilino").value || "Não informado";
    const aluguel =
      document.getElementById("valor_aluguel").value || "Não informado";
    const ultimoPagamento =
      document.getElementById("ultimo_pagamento").value || "Não informado";

    const mensagem =
`Confira os dados antes de abrir o Carnê-Leão:

Imóvel: ${nome}
Inquilino: ${inquilino}
Valor do aluguel: R$ ${aluguel}
Último pagamento: ${ultimoPagamento}

Deseja abrir o Meu Carnê-Leão?`;

    if(confirm(mensagem)){
      window.open(
        "https://cav.receita.fazenda.gov.br/autenticacao/login/index/10028",
        "_blank"
      );
    }
  }

    const nome = document.getElementById("nome").value;
    const mensagem =
`Você será redirecionado ao Portal das Finanças (Portugal)
para declarar rendas do imóvel:

${nome}

Deseja continuar?`;

  /* ---------- SALVAR / ARQUIVAR ---------- */

  async function arquivarImovel(){

    if(!confirm(
      "Deseja arquivar este imóvel?\n\n" +
      "Ele deixará de aparecer no painel principal, mas todos os lançamentos já registrados serão preservados."
    )) return;

    const { error } =
      await supabaseClient
      .from("imoveis")
      .update({ ativo: false })
      .eq("id", imovelId);

    if(error){
      console.log(error);
      alert("Erro ao arquivar.");
      return;
    }

    alert("Imóvel arquivado com sucesso.");
    window.location.href = "painel.html";
  }

  async function salvar(){

    const alugado =
      document.getElementById("alugado").value === "sim";

    const { error } =
      await supabaseClient
      .from("imoveis")
      .update({
        nome: document.getElementById("nome").value,
        endereco: document.getElementById("endereco").value,
        rgi: document.getElementById("rgi").value,
        iptu: document.getElementById("iptu").value,
        saldo_devedor:
          parseValor(document.getElementById("saldo_devedor").value),
        alugado: alugado,
        valor_aluguel: document.getElementById("valor_aluguel").value,
        ultimo_pagamento:
          document.getElementById("ultimo_pagamento").value || null,
        inquilino: document.getElementById("inquilino").value,
        data_assinatura:
          document.getElementById("data_assinatura").value || null,
        data_ultimo_reajuste:
          document.getElementById("data_ultimo_reajuste").value || null
      })
      .eq("id", imovelId);

    if(error){
      console.log(error);
      document.getElementById("status").innerText =
        "Erro ao salvar: " + error.message;
      return;
    }

    document.getElementById("status").innerText =
      "Alterações salvas com sucesso.";

    toggleAluguel();
    atualizarReajuste();
  }

  function voltar(){
    window.location.href = "painel.html";
  }

  carregarImovel();

</script>
