name: Keep Supabase Ativo

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o Supabase
        env:
          CHAVE_BRUTA: ${{ secrets.SUPABASE_KEY }}
        run: |
          CHAVE=$(printf '%s' "$CHAVE_BRUTA" | tr -d '\r\n[:space:]"')
          curl -sf "https://xkiswuhpgbifjshjmuvf.supabase.co/rest/v1/imoveis?select=id&limit=1" \
            -H "apikey: ${CHAVE}" \
            -H "Authorization: Bearer ${CHAVE}" \
            && echo " - Supabase ativo!"
