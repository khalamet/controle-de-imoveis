<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Controle de Imóveis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #1e293b;
      font-size: 28px;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1e293b;
    }

    .erro {
      color: #dc2626;
      text-align: center;
      margin-top: 15px;
      display: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<form class="login-box" id="formLogin" onsubmit="event.preventDefault(); fazerLogin();">
  <h1>Controle de Imóveis</h1>

  <div class="campo">
    <label for="email">Email</label>
    <input 
      type="email" 
      id="email" 
      placeholder="Digite seu email"
      required
      autocomplete="email">
  </div>

  <div class="campo">
    <label for="senha">Senha</label>
    <input 
      type="password" 
      id="senha" 
      placeholder="Digite sua senha"
      required
      autocomplete="current-password">
  </div>

  <button type="submit">Entrar</button>

  <div class="erro" id="erro">
    Email ou senha incorretos
  </div>
</form>

<script>
  const SUPABASE_URL = "https://xkiswuhpgbifjshjmuvf.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhraXN3dWhwZ2JpZmpzaGptdXZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5ODk4OTksImV4cCI6MjA5NDU2NTg5OX0.MfDgb2Ie-iuHtaSHOvI1w_lL8B5yqlSujJL-PMKhKGg";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function fazerLogin() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;
    const erroDiv = document.getElementById("erro");

    erroDiv.style.display = "none";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha
    });

    if (error) {
      erroDiv.style.display = "block";
      erroDiv.textContent = "Email ou senha incorretos";
      return;
    }

    localStorage.setItem("logado", "sim");
    localStorage.setItem("usuarioLogado", email);
    window.location.href = "painel.html";
  }
</script>

</body>
</html>
